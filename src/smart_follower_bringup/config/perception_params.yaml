/**:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    person_pose_topic: person_pose
    follow_command_topic: follow_command
    base_frame: base_footprint

    yolo:
      model_path: models/yolo26n_static_256x320_simplify_e2e.onnx
      input_w: 320
      input_h: 256
      person_class_id: 0
      conf_threshold: 0.25
      ort:
        intra_op_num_threads: 1
        inter_op_num_threads: 1
        execution_mode: sequential

    reid:
      model_path: models/osnet_x0_5_512.onnx
      input_w: 128
      input_h: 256
      ema_alpha: 0.2
      recover_threshold: 0.70
      ort:
        intra_op_num_threads: 1
        inter_op_num_threads: 1
        execution_mode: sequential

    process_every_n_frames: 3
    detect_every_n_frames: 1
    min_confirm_hits: 3
    max_miss_frames: 10
    feature_buffer_size: 20
    sync_cache_size: 6
    sync_slop: 0.04
    memory_sec: 30.0

    tracking:
      low_score_threshold: 0.1
      high_score_threshold: 0.5
      assignment_threshold: 0.7
      second_stage_threshold: 0.8
      weights:
        iou: 0.3
        center: 0.2
        appearance: 0.4

    monocular:
      camera_info_service: /camera/get_camera_info
      camera_x_offset_m: 0.175
      camera_y_offset_m: 0.01

    depth_compare:
      min_range_m: 0.20
      max_range_m: 4.00
      sample_window_px: 5
      min_valid_samples: 3

    lock:
      stable_frames: 5
      hold_sec: 0.6
      switch_sec: 2.0
      center_roi_ratio: 0.6
      target_area_ratio: 0.04
